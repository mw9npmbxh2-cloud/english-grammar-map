let wireRaf=0;
function queueWires(){cancelAnimationFrame(wireRaf);wireRaf=requestAnimationFrame(drawWires);}
function drawWires(){
  const map=$('#map'),svg=$('#wires');
  if(!map||!map.offsetParent)return;
  const mr=map.getBoundingClientRect();
  if(!mr.width)return;
  svg.setAttribute('width',mr.width);svg.setAttribute('height',mr.height);
  svg.setAttribute('viewBox','0 0 '+mr.width+' '+mr.height);
  const box=el=>{const r=el.getBoundingClientRect();return {l:r.left-mr.left,r:r.right-mr.left,t:r.top-mr.top,b:r.bottom-mr.top,cx:(r.left+r.right)/2-mr.left,cy:(r.top+r.bottom)/2-mr.top};};
  const n=v=>v.toFixed(1);
  let h='';
  const path=(d,color,w,op,dash)=>{h+='<path d="'+d+'" fill="none" stroke-linecap="round" stroke-width="'+w+'" opacity="'+op+'"'+(dash?' stroke-dasharray="'+dash+'"':'')+' style="stroke:'+color+'"/>';};
  const stateOp=lf=>lf.classList.contains('st-mastered')?1:lf.classList.contains('st-new')?.28:.7;
  const branches=$$('.branch',map);
  if(WIDE.matches){
    const root=box($('#root'));
    const hlink=(a,b)=>{let sx,ex;if(b.cx<a.cx){sx=a.l;ex=b.r;}else{sx=a.r;ex=b.l;}const mx=(sx+ex)/2;
      return 'M'+n(sx)+' '+n(a.cy)+' C'+n(mx)+' '+n(a.cy)+' '+n(mx)+' '+n(b.cy)+' '+n(ex)+' '+n(b.cy);};
    branches.forEach(br=>{
      const color=br.dataset.color,bn=box($('.bnode',br));
      path(hlink(root,bn),color,4,.85);
      if(!br.classList.contains('collapsed'))$$('.leaf',br).forEach(lf=>path(hlink(bn,box(lf)),color,2.5,stateOp(lf)));
    });
  }else{
    const pts=[];
    /* الطريق يمشي في الفراغ بين الصفوف: نزول، انعطاف، عبور أفقي، انعطاف، نزول. فلا يمر فوق أي نص */
    const rb=box($('#root'));pts.push({x:rb.cx,yIn:rb.t,yOut:rb.b,top:rb.t,bot:rb.b});
    branches.forEach(br=>{
      const color=br.dataset.color,bn=box($('.bnode',br));
      pts.push({x:bn.cx,yIn:bn.t,yOut:bn.b,top:bn.t,bot:bn.b,color:color,op:.6});
      if(!br.classList.contains('collapsed'))$$('.leaf',br).forEach(lf=>{const sb=box($('.station',lf)),lb=box(lf);pts.push({x:sb.cx,yIn:sb.cy,yOut:sb.cy,top:lb.t,bot:lb.b,color:color,op:stateOp(lf)});});
    });
    const fb=box($('#finish'));pts.push({x:fb.cx,yIn:fb.t,yOut:fb.b,top:fb.t,bot:fb.b});
    for(let i=1;i<pts.length;i++){
      const a=pts[i-1],b=pts[i];
      let d;
      if(Math.abs(a.x-b.x)<2)d='M'+n(a.x)+' '+n(a.yOut)+' L'+n(b.x)+' '+n(b.yIn);
      else{
        const yb=(a.bot+b.top)/2,dir=b.x<a.x?-1:1;
        const r=Math.max(3,Math.min(24,Math.abs(b.x-a.x)/2,yb-a.yOut,b.yIn-yb));
        d='M'+n(a.x)+' '+n(a.yOut)+' L'+n(a.x)+' '+n(yb-r)+' Q'+n(a.x)+' '+n(yb)+' '+n(a.x+dir*r)+' '+n(yb)+
          ' L'+n(b.x-dir*r)+' '+n(yb)+' Q'+n(b.x)+' '+n(yb)+' '+n(b.x)+' '+n(yb+r)+' L'+n(b.x)+' '+n(b.yIn);
      }
      path(d,'var(--track)',12,1);
      if(b.color)path(d,b.color,5,b.op);
      else path(d,'var(--muted)',3,.5,'2 10');
    }
  }
  svg.innerHTML=h;
}

function pickMixed(n){
  const t=today(),perTopic={};
  const scored=ALL.map(it=>{const r=S.items[it.id];
    let s;if(!r)s=2+Math.random();else if(r.d<=t)s=4+(r.w>0?1:0)+Math.random();else s=Math.random()*.5;
    return {it:it,s:s};}).sort((a,b)=>b.s-a.s);
  const out=[];
  for(const x of scored){const k=x.it.t.id;perTopic[k]=perTopic[k]||0;if(perTopic[k]>=2)continue;perTopic[k]++;out.push(x.it);if(out.length>=n)break;}
  return shuffle(out);
}
function pickDiagnostic(n){

function norm(s,strict){
  s=String(s).replace(/[‘’ʼ]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim();
  if(strict)return s;
  s=s.toLowerCase()
    .replace(/\bcan't\b/g,'can not').replace(/\bcannot\b/g,'can not').replace(/\bwon't\b/g,'will not')
    .replace(/n't\b/g,' not').replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/'ve\b/g,' have').replace(/'ll\b/g,' will')
    .replace(/\b(it|he|she|that|there|what|who|where|here)'s\b/g,'$1 is').replace(/'d\b/g,' would');
  return s.replace(/\s[-–—]\s/g,' ').replace(/[.,!?;:"]/g,' ').replace(/\s+/g,' ').trim();
}
function diffWords(a,b){
  const n=a.length,m=b.length,L=[];
  for(let i=0;i<=n;i++){L.push(new Array(m+1).fill(0));}
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ra=[],rb=[];let i=0,j=0;
  while(i<n&&j<m){
    if(a[i]===b[j]){ra.push([a[i],0]);rb.push([b[j],0]);i++;j++;}
    else if(L[i+1][j]>=L[i][j+1]){ra.push([a[i],1]);i++;}
    else{rb.push([b[j],1]);j++;}
  }
  while(i<n)ra.push([a[i++],1]);
  while(j<m)rb.push([b[j++],1]);
  return [ra,rb];
}
const cur=()=>D.queue[D.pos];
function drillTop(){
  const total=D.queue.length,done=Math.min(D.pos,total);
  return '<div class="d-top"><span class="d-title">'+mix(D.title)+'</span><span class="d-count">'+Math.min(D.pos+1,total)+' / '+total+'</span>'+
    '<button type="button" class="x" data-act="close-drill" aria-label="إنهاء التدريب">✕</button></div>'+
    '<div class="d-bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>';
}
function renderDrill(){
  const P=$('#drill-panel');
  if(D.pos>=D.queue.length){renderSummary();return;}
  const it=cur(),tp=it.t;D.answered=false;D.pending=null;
  const again=it.again?' (محاولة ثانية)':'';
  let h=drillTop();
  if(it.kind==='f'){
    const bad=tp.fx[it.i][0];
    h+='<p class="kicker">في الجملة خطأ. صحّحه بالكتابة'+again+'</p>'+
       '<p class="badline">'+esc(bad)+'</p>'+
       '<textarea id="ans" rows="3" dir="ltr" lang="en" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-label="اكتب الجملة الصحيحة">'+esc(bad)+'</textarea>'+
       '<p class="hint" id="hint">'+(tp.strict?'هنا النقطة والمسافة والحرف الكبير محسوبة.':'')+'</p>'+
       '<div id="fb"></div>'+
       '<div class="row" id="d-actions"><button type="button" class="btn primary" data-act="check">تحقق</button><button type="button" class="btn ghost" data-act="reveal">ما أعرف، ورّني</button></div>';
  }else if(it.kind==='k'){
    h+='<p class="kicker">تذكّر القاعدة'+again+'</p>'+
       '<div class="kcard"><p class="k-en" dir="ltr">'+esc(tp.en)+'</p><p class="k-ar">'+esc(tp.ar)+'</p></div>'+
       '<p class="kicker" style="font-weight:400">قل المفتاح والصيغة من ذاكرتك، ثم اكشف وقارن.</p>'+
       '<div id="fb"></div>'+
       '<div class="row" id="d-actions"><button type="button" class="btn primary" data-act="k-show">اكشف القاعدة</button></div>';
  }else{
    const q=tp.qz[it.i];
    if(!it.order)it.order=shuffle(q[1].map((_,k)=>k));
    h+='<p class="kicker">اختر الإجابة الصحيحة'+again+'</p>'+
       '<p class="q">'+esc(q[0])+'</p>'+
       '<div class="opts">'+it.order.map(o=>'<button type="button" class="opt" data-act="opt" data-o="'+o+'">'+esc(q[1][o])+'</button>').join('')+'</div>'+
       '<div id="fb"></div><div class="row" id="d-actions"></div>';
  }
  P.innerHTML=h;P.scrollTop=0;
  const ans=$('#ans');
  if(ans&&window.matchMedia('(pointer: fine)').matches){ans.focus();ans.setSelectionRange(ans.value.length,ans.value.length);}
}
function ruleLine(tp){return '<p class="rule"><b dir="ltr">'+esc(tp.en)+'</b>'+mix(tp.key)+'</p>';}
function afterAnswer(){
  const nb=$('[data-act="next"]');if(nb)nb.focus({preventScroll:true});
  $('#fb').scrollIntoView({block:'nearest'});
}
function fixFeedback(ok,val,revealed){
  const it=cur(),tp=it.t,pair=tp.fx[it.i],bad=pair[0],goods=[].concat(pair[1]);
  D.answered=true;D.pending=ok;
  const d=diffWords(bad.split(' '),goods[0].split(' '));
  let h='<div class="fb '+(ok?'good':'bad')+'" role="status"><p class="fb-title">'+(ok?'صحيح':revealed?'هذا التصحيح':'مو صحيح')+'</p>';
  if(!ok&&!revealed)h+='<p class="fb-label">كتبت</p><p class="sent">'+esc(val)+'</p>';
  h+='<p class="fb-label">الخطأ ثم التصحيح</p><p class="sent was"><span class="mk">✕</span>'+line(d[0],'del')+'</p><p class="sent now"><span class="mk">✓</span>'+line(d[1],'ins')+spk(goods[0])+'</p>';
  if(goods.length>1)h+='<p class="fb-label">ومقبول أيضاً</p>'+goods.slice(1).map(g=>'<p class="sent">'+esc(g)+'</p>').join('');
  h+=ruleLine(tp)+'</div>';
  $('#fb').innerHTML=h;
  $('#ans').disabled=true;$('#hint').textContent='';
  $('#d-actions').innerHTML='<button type="button" class="btn primary" data-act="next">التالي</button>'+
    (!ok&&!revealed?'<button type="button" class="btn ghost" data-act="override">إجابتي صحيحة، احسبها</button>':'');
  beep(ok?'ok':'bad');afterAnswer();
}
function checkFix(){
  if(!D||D.answered)return;
  const it=cur();if(it.kind!=='f')return;
  const tp=it.t,pair=tp.fx[it.i],strict=!!tp.strict,val=$('#ans').value;
  if(!val.trim())return;
  if(norm(val,strict)===norm(pair[0],strict)){$('#hint').textContent='ما غيّرت شي. في الجملة خطأ، عدّله ثم اضغط تحقق.';return;}
  fixFeedback([].concat(pair[1]).some(g=>norm(g,strict)===norm(val,strict)),val,false);
}
function keyReveal(){
  if(!D||D.answered)return;
  const it=cur(),tp=it.t;if(it.kind!=='k')return;
  $('#fb').innerHTML='<div class="kstack"><div class="box key"><h4>المفتاح</h4><p>'+mix(tp.key)+'</p></div>'+
    '<div class="box"><h4>الصيغة</h4><div class="formula">'+formulaHtml(tp)+'</div></div>'+
    '<div class="box"><h4>مثال</h4>'+pairHtml(tp.fx[0])+'</div></div>';
  $('#d-actions').innerHTML='<button type="button" class="btn primary" data-act="k-yes">حافظها</button><button type="button" class="btn" data-act="k-no">لسا ما حفظتها</button>';
  $('#fb').scrollIntoView({block:'nearest'});
}
function keyAnswer(ok){
  if(!D||D.answered||cur().kind!=='k')return;
  D.answered=true;D.pending=ok;if(ok)beep('ok');nextItem();
}
function fullSentence(q,opt){
  if(q.indexOf('______')<0)return opt;
  const parts=opt.split(' / '),blanks=q.split('______').length-1;
  if(blanks>1&&parts.length===blanks){let k=0;return q.replace(/______/g,()=>parts[k++]);}
  return q.replace(/\s*______\s*/,opt.charAt(0)==='.'||opt.charAt(0)===','?opt+' ':' '+opt+' ').replace(/\s+/g,' ').trim();
}
function answerOpt(o,btn){
  if(!D||D.answered)return;
  const it=cur(),q=it.t.qz[it.i],ok=o===0;
  D.answered=true;D.pending=ok;
  $$('.opt',$('#drill-panel')).forEach(b=>{b.disabled=true;if(+b.dataset.o===0)b.classList.add('right');});
  if(!ok)btn.classList.add('wrong');
  const full=fullSentence(q[0],q[1][0]);
  $('#fb').innerHTML='<div class="fb '+(ok?'good':'bad')+'" role="status"><p class="fb-title">'+(ok?'صحيح':'مو صحيح')+'</p>'+
    '<p class="sent now"><span class="mk">✓</span>'+esc(full)+spk(full)+'</p><p style="margin:4px 0 0;font-size:16px">'+mix(q[2])+'</p>'+ruleLine(it.t)+'</div>';
  $('#d-actions').innerHTML='<button type="button" class="btn primary" data-act="next">التالي</button>';
  beep(ok?'ok':'bad');afterAnswer();
}
function commit(){
  if(!D||!D.answered||D.pending===null)return;
  const it=cur();
  grade(it.id,D.pending);
  if(!it.again){
    D.first++;
    if(D.pending){D.firstOk++;if(D.passed.indexOf(it.t.id)<0)D.passed.push(it.t.id);}
    else{if(D.missed.indexOf(it.t.id)<0)D.missed.push(it.t.id);if(D.mode==='normal')D.queue.push(Object.assign({},it,{again:true,order:null}));}
  }
  D.answered=false;D.pending=null;
}
function nextItem(){if(!D)return;commit();D.pos++;renderDrill();}
function topicBtn(tp){return '<button type="button" class="btn" data-act="open-topic" data-t="'+tp.id+'"><span class="en" dir="ltr">'+esc(tp.en)+'</span> · '+esc(tp.ar)+'</button>';}
function renderSummary(){
  const miss=D.missed.map(id=>TOPICS.find(t=>t.id===id));
  let h='<div class="d-top"><span class="d-title">'+mix(D.title)+'</span><button type="button" class="x" data-act="close-drill" aria-label="إغلاق">✕</button></div>'+
    '<p class="kicker">من أول محاولة</p><p class="sum-score">'+D.firstOk+' / '+D.first+'</p>';
  if(D.mode==='testout'){
    if(D.first>0&&D.firstOk===D.first){
      const t=today();itemsOf(D.topic).forEach(it=>{const r=S.items[it.id]||{r:0,w:0};S.items[it.id]={b:3,d:t+7,r:r.r,w:r.w};});save();
      h+='<p class="verdict ok">نجحت. القاعدة انحسبت متقنة.</p><p class="kicker" style="font-weight:400">بترجع لك بعد أسبوع للتأكيد.</p>';
    }else{
      h+='<p class="verdict no">لسا ما ثبتت.</p><p class="kicker" style="font-weight:400">الجمل اللي غلطت فيها دخلت «راجع اليوم». درّب القاعدة كاملة ثم جرّب مرة ثانية.</p>'+
        '<div class="miss">'+topicBtn(D.topic)+'</div>';
    }
  }else if(D.mode==='diag'){
    h+='<p class="kicker">هذا تشخيص: جملة وحدة من كل قاعدة.</p>';
    if(miss.length)h+='<p class="kicker">قواعد تحتاج شغل. ابدأ فيها:</p><div class="miss">'+miss.map(topicBtn).join('')+'</div>';
    h+='<p class="kicker" style="font-weight:400">اللي جاوبتها صح بترجع لك بكرة للتأكيد، واللي غلطت فيها دخلت «راجع اليوم».</p>';
  }else if(miss.length){
    h+='<p class="kicker">قواعد غلطت فيها. اضغط للمراجعة:</p><div class="miss">'+miss.map(topicBtn).join('')+'</div>'+
      '<p class="kicker" style="font-weight:400">الجمل اللي غلطت فيها بترجع لك بكرة في «راجع اليوم».</p>';
  }else{
    h+='<p class="verdict ok">ولا غلطة.</p><p class="kicker" style="font-weight:400">البطاقات هذي بترجع لك بعد أيام للتأكيد.</p>';
  }
  h+='<div class="row"><button type="button" class="btn primary" data-act="close-drill">رجوع للخريطة</button>'+
    (D.mode==='diag'&&TOPICS.some(tp=>stat(tp).seen===0)?'<button type="button" class="btn" data-act="diag">كمّل التشخيص</button>':'<button type="button" class="btn" data-act="mixed">تدريب مختلط</button>')+'</div>';
  $('#drill-panel').innerHTML=h;
  beep('done');
}
function closeDrill(){
  if(D&&D.answered)commit();
  D=null;hideOverlay('#drill');renderAll();
}

/* ---------- العرض العام ---------- */
function renderAll(){
  renderHead();
  if(view==='map')renderMap();else renderProgress();
}
function setView(v){
  view=v;
  $('#view-map').hidden=v!=='map';$('#view-err').hidden=v!=='err';$('#map-tools').hidden=v!=='map';
  $$('[data-act="view"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)));
  renderAll();
}
function gotoNext(){
  const nx=nextTopic()||TOPICS.find(tp=>stat(tp).due>0);
  if(!nx)return;
  if(view!=='map')setView('map');
  if(collapsed.has(nx.b)||query||filter!=='all'){
    collapsed.delete(nx.b);query='';filter='all';$('#search').value='';
    $$('[data-act="filter"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.f==='all')));
    renderMap();
  }
  requestAnimationFrame(()=>{const el=$('.leaf[data-t="'+nx.id+'"]');if(el)el.scrollIntoView({block:'center',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});});
}

document.addEventListener('click',e=>{
  if(e.target.id==='sheet'){hideOverlay('#sheet');return;}
  if(e.target.id==='menu'){hideOverlay('#menu');return;}
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='speak'){e.stopPropagation();speak(el.dataset.say);}
  else if(act==='open-topic'){if(D){closeDrill();}openSheet(+el.dataset.t);}
  else if(act==='toggle-branch'){const id=+el.dataset.b;if(collapsed.has(id))collapsed.delete(id);else collapsed.add(id);renderMap();}
  else if(act==='fold-all'){if(collapsed.size>=BRANCHES.length)collapsed.clear();else BRANCHES.forEach(b=>collapsed.add(b.id));renderMap();}
  else if(act==='view')setView(el.dataset.v);
  else if(act==='filter'){filter=el.dataset.f;$$('[data-act="filter"]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));renderMap();}
  else if(act==='goto-next')gotoNext();
  else if(act==='next-rule'){const nx=nextTopic();if(nx){if(D)closeDrill();openSheet(nx.id);}}
  else if(act==='review'){const t=today();startDrill('مراجعة اليوم',shuffle(ALL.filter(it=>{const r=S.items[it.id];return r&&r.d<=t;})).slice(0,20));}
  else if(act==='mixed'){startDrill('تدريب مختلط',pickMixed(10));}
  else if(act==='diag'){startDrill('تشخيص سريع',pickDiagnostic(13),'diag');}
  else if(act==='drill-active'){startDrill('أخطاء ما اختفت',shuffle(ALL.filter(it=>{const r=S.items[it.id];return r&&r.b===0&&r.w>0;})).slice(0,20));}
  else if(act==='drill-topic'){if(sheetTopic){const its=itemsOf(sheetTopic);startDrill(sheetTopic.en,[its[0]].concat(shuffle(its.slice(1))));}}
  else if(act==='test-out'){if(sheetTopic)startDrill('اختبار: '+sheetTopic.en,pickTestOut(sheetTopic),'testout',sheetTopic);}
  else if(act==='reset-topic'){if(sheetTopic){itemsOf(sheetTopic).forEach(it=>{delete S.items[it.id];});save();renderAll();openSheet(sheetTopic.id);}}
  else if(act==='close-sheet')hideOverlay('#sheet');
  else if(act==='close-drill')closeDrill();
  else if(act==='menu')openMenu();
  else if(act==='close-menu')hideOverlay('#menu');
  else if(act==='copy-backup')copyBackup();
  else if(act==='import-backup')importBackup();
  else if(act==='theme'){S.theme=currentTheme()==='dark'?'light':'dark';save();applyTheme();if(!$('#menu').hidden)openMenu();queueWires();}
  else if(act==='sound'){S.sound=!S.sound;save();if(S.sound)beep('ok');if(!$('#menu').hidden)openMenu();}
  else if(act==='check')checkFix();
  else if(act==='reveal'){if(D&&!D.answered)fixFeedback(false,'',true);}
  else if(act==='override'){if(D&&D.answered){D.pending=true;el.remove();const f=$('#fb .fb');f.classList.remove('bad');f.classList.add('good');$('.fb-title',f).textContent='انحسبت صحيحة';}}
  else if(act==='next')nextItem();
  else if(act==='k-show')keyReveal();
  else if(act==='k-yes')keyAnswer(true);
  else if(act==='k-no')keyAnswer(false);
  else if(act==='opt')answerOpt(+el.dataset.o,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(!$('#menu').hidden)hideOverlay('#menu');else if(!$('#sheet').hidden)hideOverlay('#sheet');else if(!$('#drill').hidden)closeDrill();return;}
  if(e.key==='Enter'&&e.target.id==='ans'&&!e.shiftKey){e.preventDefault();checkFix();}
});
$('#search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();renderMap();});
if(window.ResizeObserver)new ResizeObserver(queueWires).observe($('#map'));
window.addEventListener('resize',queueWires);
if(WIDE.addEventListener)WIDE.addEventListener('change',queueWires);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(queueWires);

loadLocal();
applyTheme();
renderAll();
cloudInit();
})();
</script>
</body>
