<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خريطة قواعد الإنجليزية A2 → B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: a night route map. On phones and foldables the rules are glowing stations on one winding road, grouped under branch banners; from 920px it opens into a two-sided mind map. */
  --bg:#f1f4fa; --solid:#ffffff; --surface:rgba(255,255,255,.88); --sunken:#e8edf6; --ink:#0f172a; --muted:#55627a;
  --line:rgba(15,23,42,.12); --track:rgba(15,23,42,.11);
  --a1:#0284c7; --a2:#4f46e5; --a3:#9333ea; --accent:#0369a1; --accent-ink:#ffffff;
  --grad:linear-gradient(135deg,#0284c7 0%,#4f46e5 55%,#9333ea 100%);
  --ok:#047857; --bad:#be123c; --due:#b45309;
  --ok-bg:rgba(5,150,105,.12); --bad-bg:rgba(225,29,72,.10); --due-bg:rgba(217,119,6,.14);
  --glow1:rgba(14,165,233,.16); --glow2:rgba(147,51,234,.12); --dot:rgba(15,23,42,.07);
  --scrim:rgba(15,23,42,.5); --on-bc:#0b1220;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
  --font-d:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --font-b:"IBM Plex Sans Arabic","Readex Pro","Segoe UI",Tahoma,sans-serif;
  --font-en:"IBM Plex Sans","Readex Pro","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060a13; --solid:#101929; --surface:rgba(16,25,41,.82); --sunken:rgba(5,9,18,.62); --ink:#eef3fa; --muted:#96a3b8;
    --line:rgba(148,163,184,.18); --track:rgba(148,163,184,.17);
    --a1:#38bdf8; --a2:#818cf8; --a3:#c084fc; --accent:#7dd3fc; --accent-ink:#04121f;
    --grad:linear-gradient(135deg,#38bdf8 0%,#818cf8 55%,#c084fc 100%);
    --ok:#34d399; --bad:#fb7185; --due:#fbbf24;
    --ok-bg:rgba(52,211,153,.13); --bad-bg:rgba(251,113,133,.13); --due-bg:rgba(251,191,36,.13);
    --glow1:rgba(56,189,248,.17); --glow2:rgba(192,132,252,.15); --dot:rgba(148,163,184,.13);
    --scrim:rgba(2,6,14,.74); --on-bc:#06101d;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060a13; --solid:#101929; --surface:rgba(16,25,41,.82); --sunken:rgba(5,9,18,.62); --ink:#eef3fa; --muted:#96a3b8;
  --line:rgba(148,163,184,.18); --track:rgba(148,163,184,.17);
  --a1:#38bdf8; --a2:#818cf8; --a3:#c084fc; --accent:#7dd3fc; --accent-ink:#04121f;
  --grad:linear-gradient(135deg,#38bdf8 0%,#818cf8 55%,#c084fc 100%);
  --ok:#34d399; --bad:#fb7185; --due:#fbbf24;
  --ok-bg:rgba(52,211,153,.13); --bad-bg:rgba(251,113,133,.13); --due-bg:rgba(251,191,36,.13);
  --glow1:rgba(56,189,248,.17); --glow2:rgba(192,132,252,.15); --dot:rgba(148,163,184,.13);
  --scrim:rgba(2,6,14,.74); --on-bc:#06101d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.65;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--a1);outline-offset:3px}
.en{font-family:var(--font-en);unicode-bidi:isolate}
bdi.en{font-weight:500}
.num-ltr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(70% 45% at 92% -6%,var(--glow1),transparent 70%),
  radial-gradient(62% 46% at -8% 104%,var(--glow2),transparent 70%),
  radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0) 0 0/28px 28px}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:14px 14px 116px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hero::before{content:"";position:absolute;inset:0;background:var(--grad);opacity:.16;pointer-events:none;-webkit-mask-image:radial-gradient(120% 95% at 100% 0%,#000 0%,transparent 62%);mask-image:radial-gradient(120% 95% at 100% 0%,#000 0%,transparent 62%)}
.hero>*{position:relative}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.lvl{display:inline-block;font-family:var(--font-d);font-weight:600;font-size:14px;letter-spacing:.02em;padding:3px 12px;border-radius:999px;background:var(--grad);color:var(--accent-ink)}
.brand h1{margin:8px 0 4px;font-family:var(--font-d);font-size:28px;font-weight:700;line-height:1.25;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:15px;max-width:46ch}
.hero-tools{display:flex;gap:8px;flex:0 0 auto}
.icon-btn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--sunken);display:grid;place-items:center;color:var(--ink);transition:transform .12s ease,background-color .15s ease}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}
.hero-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.bigring{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--a1),var(--a3) calc(var(--p)*1%),var(--track) 0);box-shadow:0 0 34px -8px var(--a2)}
.bigring>button{width:88px;height:88px;border-radius:50%;border:0;background:var(--solid);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.bigring b{font-family:var(--font-d);font-size:26px;font-weight:700}
.bigring span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border-radius:16px;padding:9px 12px;background:var(--sunken);border:1px solid var(--line);min-width:0}
.stat b{display:block;direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--font-d);font-size:22px;line-height:1.25;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:13px;color:var(--muted);line-height:1.35}
.stat.s-ok b{color:var(--ok)} .stat.s-due b{color:var(--due)} .stat.s-bad b{color:var(--bad)} .stat.s-fire b{color:var(--accent)}
.actions{display:none;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--solid);border-radius:16px;padding:12px 20px;font-family:var(--font-d);font-weight:600;font-size:17px;min-height:54px;transition:transform .12s ease,box-shadow .15s ease,filter .15s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border:0;color:var(--accent-ink);box-shadow:0 12px 28px -12px var(--a2)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:8px 16px;font-size:15px;border-radius:13px}
.btn:disabled{opacity:.5;cursor:default}
@media (hover:hover){.btn:hover{filter:brightness(1.06)}}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;gap:10px;padding:12px 14px 16px;background:var(--surface);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dock .btn{flex:1 1 0;min-width:0;max-width:340px;white-space:nowrap;padding-inline:12px}
.dock .btn.primary{flex:1.6 1 0;max-width:460px}

/* toolbar */
.bar{display:flex;flex-direction:column;gap:12px;padding:18px 0 8px}
.seg{display:flex;background:var(--sunken);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1 1 0;border:0;background:transparent;border-radius:12px;padding:9px 18px;font-family:var(--font-d);font-weight:600;font-size:16px;color:var(--muted);min-height:46px;transition:background-color .15s ease,color .15s ease}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:var(--shadow)}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 240px;min-width:0;border:1px solid var(--line);background:var(--solid);border-radius:16px;padding:11px 16px;font-size:16px;min-height:50px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0;max-width:100%;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--solid);border-radius:999px;padding:8px 18px;font-family:var(--font-d);font-size:15px;font-weight:500;color:var(--muted);min-height:44px;transition:background-color .15s ease,color .15s ease}
.chip-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip-btn.alt{border-style:dashed;color:var(--accent)}

/* route map (phones and foldables) */
.map{position:relative;display:flex;flex-direction:column;gap:6px;max-width:620px;margin:10px auto 0;padding:4px 0 12px}
.wires{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
.root,.finish,.bnode,.leaf{position:relative;z-index:1}
.root,.finish{align-self:center;font-family:var(--font-d);font-weight:600;font-size:15px;padding:7px 20px;border-radius:999px;background:var(--solid);border:1px solid var(--line);box-shadow:var(--shadow)}
.finish{margin-top:26px;background:var(--grad);color:var(--accent-ink);border:0}
.root{margin-bottom:22px}
.root .r-desk{display:none}
.side{display:flex;flex-direction:column;gap:6px}
.branch{display:flex;flex-direction:column;gap:0;margin-bottom:30px}
.bnode{display:flex;align-items:center;gap:14px;width:100%;text-align:right;padding:14px 16px;border-radius:22px;background:var(--surface);border:1.5px solid var(--bc);box-shadow:0 16px 36px -22px var(--bc),var(--shadow);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:transform .12s ease}
.bnode:active{transform:scale(.985)}
.bnode .num{flex:0 0 46px;width:46px;height:46px;border-radius:50%;background:var(--bc);color:var(--on-bc);font-family:var(--font-d);font-weight:700;font-size:20px;display:grid;place-items:center;box-shadow:0 0 22px -4px var(--bc)}
.bnode .b-txt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:1px}
.bnode .b-ar{font-family:var(--font-d);font-size:19px;font-weight:600;line-height:1.4}
.bnode .b-en{font-size:14px;color:var(--muted);line-height:1.35}
.bnode .b-bar{display:block;height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:7px}
.bnode .b-bar i{display:block;height:100%;border-radius:3px;background:var(--bc)}
.bnode .b-count{flex:0 0 auto;direction:ltr;unicode-bidi:isolate;font-family:var(--font-d);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--sunken);border:1px solid var(--line);border-radius:999px;padding:3px 13px}
.bnode .chev{flex:0 0 auto;width:11px;height:11px;border-right:2.5px solid var(--muted);border-bottom:2.5px solid var(--muted);transform:rotate(45deg);margin:0 4px 5px;transition:transform .2s ease}
.branch.collapsed .bnode .chev{transform:rotate(135deg);margin-bottom:0}
.leaves{display:flex;flex-direction:column;padding:28px 6px 0}
.branch.collapsed .leaves{display:none}
.leaf{display:flex;align-items:center;gap:18px;width:100%;min-height:118px;padding:16px 0;background:none;border:0;text-align:right;transition:transform .12s ease}
.leaf.flip{flex-direction:row-reverse;text-align:left}
.leaf:active{transform:scale(.985)}
.station{position:relative;flex:0 0 80px;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:var(--solid);box-shadow:0 0 0 1px var(--line),var(--shadow)}
.station .ring{position:absolute;inset:0;width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--track);stroke-width:6}
.ring .prg{fill:none;stroke:var(--bc);stroke-width:6;stroke-linecap:round}
.st-num{position:relative;font-family:var(--font-d);font-weight:600;font-size:23px;color:var(--muted);font-variant-numeric:tabular-nums}
.station .chk{position:relative;width:34px;height:34px;color:var(--on-bc)}
.st-learning .station,.st-due .station{box-shadow:0 0 0 1px var(--line),0 0 30px -6px var(--bc)}
.st-learning .st-num,.st-due .st-num{color:var(--ink)}
.st-mastered .station{background:var(--bc);box-shadow:0 0 34px -4px var(--bc)}
.st-mastered .ring{display:none}
@keyframes pulse{0%{transform:scale(.94);opacity:.9}70%{transform:scale(1.12);opacity:0}100%{opacity:0}}
.leaf.has-due .station::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2.5px solid var(--due);animation:pulse 2s ease-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.flag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--grad);color:var(--accent-ink);font-family:var(--font-d);font-weight:600;font-size:13px;line-height:1.5;padding:2px 12px;border-radius:999px;box-shadow:0 8px 18px -8px var(--a2);animation:bob 1.8s ease-in-out infinite;z-index:2}
.leaf.next .station{box-shadow:0 0 0 3px var(--a1),0 0 34px -4px var(--a2)}
.leaf.next .st-num{color:var(--ink)}
.leaf-txt{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.flip .leaf-txt{align-items:flex-end}
.leaf-txt .en{font-family:var(--font-en);font-weight:600;font-size:19px;line-height:1.3;overflow-wrap:anywhere;text-align:right}
.flip .leaf-txt .en{text-align:left}
.leaf-txt .ar{font-size:15px;color:var(--muted);line-height:1.45}
.tags{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.lv{font-family:var(--font-en);font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:1px 7px;color:var(--muted);unicode-bidi:isolate}
.st-chip{font-family:var(--font-d);font-size:13px;font-weight:500;border-radius:999px;padding:1px 10px;background:var(--sunken);color:var(--muted)}
.st-chip.ok{background:var(--ok-bg);color:var(--ok)}
.st-chip.due{background:var(--due-bg);color:var(--due)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:22px;color:var(--muted);font-size:15px;text-align:center}

/* mind map (wide screens) */
@media (min-width:920px){
  .wrap{padding:24px 24px 36px}
  .hero{padding:26px 28px;flex-direction:row;align-items:center;flex-wrap:wrap;gap:20px 32px}
  .hero-top{flex:1 1 380px}
  .brand h1{font-size:36px}
  .hero-main{flex:0 0 auto}
  .stats{grid-template-columns:repeat(4,128px)}
  .actions{display:flex;flex:1 1 100%}
  .actions .btn{min-width:210px}
  .dock{display:none}
  .bar{flex-direction:row;align-items:center;justify-content:space-between;padding-top:22px}
  .seg{display:inline-flex} .seg button{flex:0 0 auto}
  .map{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:56px;align-items:center;max-width:none;margin-top:18px}
  .side{gap:26px}
  .side-a{grid-column:1;grid-row:1} .root{grid-column:2;grid-row:1} .side-b{grid-column:3;grid-row:1}
  .finish{display:none}
  .root{margin:0;width:208px;min-height:208px;border-radius:50%;padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px;background:var(--solid);border:0;box-shadow:0 0 0 2px var(--a2),0 0 60px -10px var(--a2)}
  .root .r-phone{display:none}
  .root .r-desk{display:flex;flex-direction:column;align-items:center;gap:4px}
  .root .r-title{font-size:18px}
  .root .r-level{font-family:var(--font-d);font-size:22px;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .root .r-count{font-size:14px;font-weight:400;color:var(--muted)}
  .branch{flex-direction:row;align-items:center;gap:40px;margin:0}
  .side-a .branch{flex-direction:row-reverse}
  .bnode{flex:0 0 164px;width:auto;flex-direction:column;text-align:center;gap:6px;padding:16px 12px}
  .bnode .b-txt{flex:0 0 auto;align-items:center;width:100%}
  .bnode .b-ar{font-size:17px}
  .bnode .b-bar{width:100%}
  .bnode .chev{display:none}
  .leaves{flex:1 1 0;min-width:0;gap:10px;padding:0}
  .side-a .leaves{align-items:flex-end}
  .leaf,.leaf.flip{flex-direction:row;text-align:right;min-height:70px;max-width:400px;gap:12px;padding:9px 12px;background:var(--solid);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
  .side-a .leaf,.side-a .leaf.flip{flex-direction:row-reverse}
  .flip .leaf-txt{align-items:flex-start}
  .flip .leaf-txt .en{text-align:right}
  .station{flex:0 0 50px;width:50px;height:50px}
  .st-num{font-size:16px}
  .station .chk{width:24px;height:24px}
  .flag{top:-16px;font-size:12px}
  .leaf-txt .en{font-size:16px}
  .leaf-txt .ar{font-size:13.5px}
  .tags{margin-top:2px}
  .leaf:hover{border-color:var(--bc);transform:translateY(-1px)}
}
.foot{margin-top:26px;padding:16px 4px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

/* progress view */
.err{display:flex;flex-direction:column;gap:12px;max-width:760px;margin:8px auto 0}
.err h2{font-family:var(--font-d);font-size:20px;margin:14px 0 0}
.err p.sub{margin:0;color:var(--muted);font-size:15px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.day i{width:100%;max-width:46px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--font-d);font-weight:600;font-size:15px;background:var(--sunken);border:1px solid var(--line);color:var(--muted)}
.day.on i{background:var(--grad);border:0;color:var(--accent-ink)}
.day.today{color:var(--ink);font-weight:600}
.weekline{margin:12px 0 0;font-size:15px}
.err-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(60px,1fr) 40px;gap:12px;align-items:center;width:100%;text-align:right;background:var(--solid);border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-height:58px}
.err-row .nm{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.err-row .track{height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.err-row .track i{display:block;height:100%;background:var(--bad);border-radius:5px}
.err-row .n{font-family:var(--font-d);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.act-item{background:var(--solid);border:1px solid var(--line);border-inline-start:5px solid var(--bad);border-radius:16px;padding:10px 14px}
.act-item .meta{font-size:13px;color:var(--muted);margin:2px 0 0}

/* sheets */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.overlay{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .18s ease;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.panel{position:relative;background:var(--solid);color:var(--ink);width:100%;max-width:720px;max-height:94%;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px 16px 30px;display:flex;flex-direction:column;gap:16px;animation:slideUp .24s ease;border:1px solid var(--line);border-bottom:0}
.panel.tinted{border-top:4px solid var(--bc)}
.drill .panel{height:100%;max-height:100%;border-radius:0;border:0}
@media (min-width:720px){
  .overlay{align-items:center;padding:24px}
  .panel{border-radius:28px;max-height:100%;padding:26px;border-bottom:1px solid var(--line)}

}

.p-head .p-ar{font-family:var(--font-d);font-size:17px;color:var(--muted)}
.p-head .p-sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.x{flex:0 0 auto;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--sunken);font-size:19px;line-height:1}
.box{background:var(--sunken);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.box h4{margin:0 0 8px;font-family:var(--font-d);font-size:14px;font-weight:600;color:var(--muted)}
.box p{margin:0;font-size:16.5px}
.sig{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.sig-l{font-size:13px;color:var(--muted)}
.sig-w{font-size:14px;font-weight:500;padding:2px 11px;border-radius:999px;background:var(--solid);border:1px solid var(--line)}
.formula{display:flex;flex-direction:column;gap:8px}
.f-row{display:flex;gap:10px;align-items:flex-start;direction:ltr;background:var(--solid);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.f-row code{flex:1 1 0;min-width:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:14.5px;line-height:1.6;text-align:left;overflow-wrap:anywhere}
.f-tag{flex:0 0 auto;direction:rtl;font-family:var(--font-d);font-size:12.5px;font-weight:600;border-radius:8px;padding:2px 9px;margin-top:1px}
.f-tag.f0{background:var(--ok-bg);color:var(--ok)} .f-tag.f1{background:var(--bad-bg);color:var(--bad)} .f-tag.f2{background:var(--due-bg);color:var(--due)}
.key{background:var(--due-bg);border-color:transparent;border-inline-start:5px solid var(--due)}
.pair{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-bottom:1px solid var(--line)}
.pair:first-of-type{padding-top:0} .pair:last-child{border-bottom:0;padding-bottom:0}
.sent{font-family:var(--font-en);direction:ltr;text-align:left;margin:0;font-size:17.5px;line-height:1.5;overflow-wrap:anywhere}
.sent.was{color:var(--bad)} .sent.now{color:var(--ok)}
.sent .mk{display:inline-block;width:1.4em;font-weight:600}
.sent del{text-decoration:line-through;background:var(--bad-bg);border-radius:5px;padding:0 4px}
.sent ins{text-decoration:none;font-weight:600;background:var(--ok-bg);border-radius:5px;padding:0 4px}
.spk{display:inline-grid;place-items:center;vertical-align:middle;width:34px;height:34px;margin-inline-start:6px;border-radius:50%;border:1px solid var(--line);background:var(--solid);color:var(--accent)}

.meter{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.meter .track{flex:1;height:10px;background:var(--track);border-radius:5px;overflow:hidden}
.meter .track i{display:block;height:100%;background:var(--grad);border-radius:5px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 150px}
.note{margin:0;font-size:14px;color:var(--muted)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.backup{width:100%;min-height:110px;font-family:var(--font-mono);font-size:13px;direction:ltr;text-align:left;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--sunken);resize:vertical}

/* drill */
.d-top{display:flex;align-items:center;gap:12px}
.d-top .d-title{font-family:var(--font-d);font-weight:600;font-size:18px;flex:1;min-width:0}

.d-bar i{display:block;height:100%;background:var(--grad);border-radius:4px;transition:width .25s}
.kicker{margin:0;font-family:var(--font-d);font-size:15.5px;font-weight:500;color:var(--muted)}
.badline{font-family:var(--font-en);direction:ltr;text-align:left;font-size:21px;line-height:1.5;margin:0;padding:16px 18px;background:var(--bad-bg);border-left:5px solid var(--bad);border-radius:16px;overflow-wrap:anywhere}
.q{font-family:var(--font-en);direction:ltr;text-align:left;font-size:21px;line-height:1.5;margin:0;overflow-wrap:anywhere}
#ans{width:100%;font-family:var(--font-en);font-size:20px;line-height:1.5;direction:ltr;text-align:left;border:2px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--sunken);resize:vertical;min-height:108px}
#ans:focus{border-color:var(--a1);outline:none;box-shadow:0 0 0 4px var(--glow1)}
.hint{margin:0;font-size:14.5px;color:var(--due);min-height:1.6em}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font-family:var(--font-en);direction:ltr;text-align:left;font-size:19px;border:2px solid var(--line);background:var(--sunken);border-radius:16px;padding:14px 18px;min-height:60px;overflow-wrap:anywhere;transition:transform .12s ease,border-color .15s ease}
.opt:active{transform:scale(.985)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;animation:slideUp .2s ease}
.fb.good{background:var(--ok-bg)} .fb.bad{background:var(--bad-bg)}
.fb-title{margin:0;font-family:var(--font-d);font-weight:700;font-size:19px}
.fb.good .fb-title{color:var(--ok)} .fb.bad .fb-title{color:var(--bad)}
.fb-label{margin:4px 0 0;font-size:13px;color:var(--muted)}
.fb .sent{color:var(--ink)} .fb .sent.was{color:var(--bad)} .fb .sent.now{color:var(--ok)}
.rule{margin:8px 0 0;font-size:15.5px;border-top:1px solid var(--line);padding-top:10px}
.rule b{display:block;text-align:right;font-family:var(--font-en)}
.kcard{background:var(--sunken);border:1px solid var(--line);border-radius:22px;padding:34px 16px;text-align:center}
.kcard .k-en{font-family:var(--font-en);font-size:27px;font-weight:600;margin:0;line-height:1.3}
.kcard .k-ar{margin:6px 0 0;color:var(--muted);font-family:var(--font-d);font-size:17px}
.kstack{display:flex;flex-direction:column;gap:10px}
.sum-score{direction:ltr;unicode-bidi:isolate;text-align:right;font-family:var(--font-d);font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin:0;line-height:1.1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.verdict{margin:0;font-family:var(--font-d);font-size:19px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--due)}
.miss{display:flex;flex-direction:column;gap:8px}
.miss .btn{text-align:right}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

];

const TOPICS=[
{id:1,b:1,lv:"A2",ar:"المضارع البسيط",en:"Present Simple",

{id:2,b:1,lv:"A2",ar:"المضارع المستمر",en:"Present Continuous",
 f:["Subject + am/is/are + Verb-ing","Subject + am/is/are not + Verb-ing","Am/Is/Are + Subject + Verb-ing?"],

     ["She ______ three different hospitals in her career so far.",["has managed","managed","was managing"],"خبرة حتى الآن بدون وقت محدد: المضارع التام."]]},
{id:8,b:2,lv:"B1",ar:"المضارع التام المستمر",en:"Present Perfect Continuous",
 f:["Subject + have/has been + Verb-ing","Subject + have/has not been + Verb-ing","Have/Has + Subject + been + Verb-ing?"],
 ex:"يركز على طول المدة لحدث بدأ في الماضي وما زال مستمراً أو آثاره واضحة الآن.",
 key:"مدة مستمرة لحد الآن مع for/since لا تأخذ المضارع المستمر (am waiting) بل have been waiting.",
 fx:[["I am waiting for two hours!",["I have been waiting for two hours!","I have waited for two hours!"]],
     ["She has being studying all morning.","She has been studying all morning."],
     ["We are working on this problem since Monday.",["We have been working on this problem since Monday.","We have worked on this problem since Monday."]],
     ["He has been work here since 2020.","He has been working here since 2020."],
     ["I am living in Riyadh since 2015.",["I have been living in Riyadh since 2015.","I have lived in Riyadh since 2015."]],
     ["They have been test the server all day.","They have been testing the server all day."]],
 qz:[["I ______ for a parking space for 30 minutes, and I still cannot find one.",["have been looking","looked","am looking"],"فعل مستمر منذ 30 دقيقة ولم ينتهِ: have been looking."],
     ["The engineers ______ the server issue since 8 AM.",["have been investigating","investigated","are investigating"],"نشاط مستمر من وقت محدد حتى الآن: المضارع التام المستمر."]]},
{id:9,b:2,lv:"B1",ar:"الماضي التام",en:"Past Perfect",
 f:["Subject + had + V3","Subject + had not + V3","Had + Subject + V3?"],
 ex:"لتمييز الحدث الأقدم بين حدثين وقعا في الماضي.",
 key:"الحدث الأقدم = had + V3 · الحدث الأحدث = ماضي بسيط.",
 fx:[["When I arrived, the meeting already started.","When I arrived, the meeting had already started."],
     ["The patient already left when the doctor arrived.","The patient had already left when the doctor arrived."],
     ["By the time we called, the pharmacy has closed.","By the time we called, the pharmacy had closed."],
     ["I could not log in because I had forget my password.","I could not log in because I had forgotten my password."],
     ["She said she had saw the report before.","She said she had seen the report before."],
     ["When we reached the office, the manager already went home.","When we reached the office, the manager had already gone home."]],
 qz:[["By the time the ambulance arrived, the team ______ first aid.",["had provided","provided","has provided"],"الإسعافات تمت قبل وصول الإسعاف، فالأقدم يأخذ had provided."],
     ["I realized I ______ my ID card at home after I reached the office.",["had left","left","have left"],"نسيان البطاقة وقع قبل الوصول للمكتب: الماضي التام."]]},
{id:10,b:2,lv:"B1",ar:"الاعتياد في الماضي",en:"Used to",
 f:["Subject + used to + Verb (base)","Subject + did not use to + Verb (base)","Did + Subject + use to + Verb (base)?"],
 ex:"لعادة أو حالة كانت تتكرر في الماضي ثم توقفت الآن.",
 key:"بعد used to يأتي الفعل بأصله. ومع did أو didn't تُحذف d فتصير use to.",
 fx:[["I used to working night shifts.","I used to work night shifts."],
     ["He didn't used to like medical IT.","He didn't use to like medical IT."],
     ["We use to print every report.","We used to print every report."],
     ["She used to works in the emergency department.","She used to work in the emergency department."],
     ["Did he used to manage this unit?","Did he use to manage this unit?"],
     ["I was used to live near the hospital.","I used to live near the hospital."]],
 qz:[["Our department ______ use paper files, but now everything is digital.",["used to","was used","uses to"],"وضع سابق تغيّر الآن: used to + base."],
     ["Did you ______ live near the central hospital?",["use to","used to","using to"],"مع Did تُحذف d: use to."]]},

{id:11,b:3,lv:"A2",ar:"القدرة والاستئذان",en:"Can / Could / Be able to",
 f:["Subject + can/could + Verb (base)","Subject + cannot/could not + Verb (base)","Can/Could + Subject + Verb (base)?"],
 ex:"can للقدرة والاستئذان في الحاضر. could للقدرة في الماضي أو للطلب المؤدب. be able to للقدرة في بقية الأزمنة.",
 key:"بعد can و could يأتي الفعل مباشرة: بدون to وبدون ‎-s. ولا تجتمع can مع will أو do.",
 fx:[["Can you to send the file?","Can you send the file?"],
     ["Yesterday I can't access the system.","Yesterday I couldn't access the system."],
     ["She can speaks three languages.","She can speak three languages."],
     ["I could not to open the attachment.","I could not open the attachment."],
     ["He doesn't can come today.","He cannot come today."],
     ["Will you can attend the meeting tomorrow?","Will you be able to attend the meeting tomorrow?"]],
 qz:[["Excuse me, ______ you please explain this prescription?",["could","can to","are able"],"للطلب المؤدب: could ثم الفعل مباشرة."],
     ["After three weeks of training, she is now ______ handle the software alone.",["able to","can","could"],"بعد is تأتي able to للتعبير عن اكتساب القدرة."]]},
{id:12,b:3,lv:"B1",ar:"الإلزام والمنع وعدم الضرورة",en:"Must / Have to / Mustn't",
 f:["must / have to + base (obligation)","mustn't = ممنوع  |  don't have to = ليس ضرورياً","Do you have to...?"],
 ex:"must و have to للإلزام. الفرق في النفي: mustn't تعني المنع، و don't have to تعني أن الأمر اختياري. و needn't بنفس معنى don't have to.",
 key:"mustn't = ممنوع · don't have to = براحتك، مو إجباري.",
 fx:[["You mustn't pay, it's free.","You don't have to pay, it's free."],
     ["Staff don't have to smoke inside the hospital.","Staff mustn't smoke inside the hospital."],
     ["You must to wear gloves in the lab.","You must wear gloves in the lab."],
     ["She have to finish the report today.","She has to finish the report today."],
     ["Visitors don't have to touch the equipment. It is dangerous.","Visitors mustn't touch the equipment. It is dangerous."],
     ["Do I must sign this form?",["Do I have to sign this form?","Must I sign this form?"]]],
 qz:[["Employees ______ wear their security ID badges inside the facility at all times.",["must","don't have to","might"],"قواعد العمل الملزمة: must."],
     ["Tomorrow is a public holiday, so we ______ wake up early.",["don't have to","mustn't","shouldn't to"],"لا توجد ضرورة للاستيقاظ: don't have to."]]},
{id:13,b:3,lv:"A2",ar:"النصيحة والاقتراح",en:"Should / Shouldn't",
 f:["Subject + should + Verb (base)","Subject + should not + Verb (base)","Should + Subject + Verb (base)?"],
 ex:"لتقديم النصيحة والرأي والتوجيه. و ought to بنفس معنى should لكنها أقل استخداماً.",
 key:"لا تضع to بعد should. الصحيح should check وليس should to check.",
 fx:[["You should to review the report.","You should review the report."],
     ["He shouldn't to ignore the symptoms.","He shouldn't ignore the symptoms."],
     ["You should checking the cable first.","You should check the cable first."],
     ["She should takes a break.","She should take a break."],
     ["We don't should share passwords.","We shouldn't share passwords."],
     ["What I should do now?","What should I do now?"]],
 qz:[["Before sending the file to the manager, we should ______ all figures.",["verify","to verify","verifying"],"بعد should يأتي الفعل بأصله بدون to."],
     ["Patients with acute symptoms ______ wait in the reception area.",["should not","should not to","don't should"],"النفي: should not ثم الفعل مباشرة."]]},
{id:14,b:3,lv:"B1",ar:"الاحتمال والاستنتاج",en:"May / Might / Deduction",
 f:["may / might / could + base  |  must be / can't be","may not / might not + base","Might it be...?"],
 ex:"may و might للاحتمال غير الأكيد. must be لاستنتاج شبه أكيد، و can't be لاستنتاج أن الشيء مستحيل.",
 key:"may / might = ربما · must be = أكيد كذا · can't be = مستحيل. وبعدها كلها الفعل بأصله بدون to.",
 fx:[["She worked all night, so she can be very tired.","She worked all night, so she must be very tired."],
     ["The lab results might to be ready.","The lab results might be ready."],
     ["He may comes late today.","He may come late today."],
     ["It can't to be true.","It can't be true."],
     ["She might not to attend the meeting.","She might not attend the meeting."],
     ["He might be comes later.","He might come later."]],
 qz:[["Dr. Salem hasn't left his office yet; he ______ still busy with a patient.",["must be","can't be","must to be"],"استنتاج منطقي شبه أكيد: must be."],
     ["We ______ get the delivery today, but it depends on traffic.",["might","must","can't"],"التردد (depends on traffic) يدل على احتمال: might."]]},

{id:15,b:4,lv:"A2",ar:"أدوات النكرة والمعرفة",en:"Articles (a / an / the)",
 f:["a + consonant sound  |  an + vowel sound  |  the + specific thing","No article with plurals and uncountable nouns in general","-"],
 ex:"a/an للمفرد المعدود غير المحدد (a doctor, an hour). the للشيء المحدد المعروف للطرفين.",
 key:"المفرد المعدود لازم قبله أداة (a/an/the). ولا تضع a/an قبل الجمع أو غير المعدود.",
 fx:[["I need a help with this task.","I need help with this task."],
     ["She is an doctor at the hospital.","She is a doctor at the hospital."],
     ["He is engineer in the IT department.","He is an engineer in the IT department."],
     ["I waited for a hour.","I waited for an hour."],
     ["Please close door.","Please close the door."],
     ["I have meeting at 3 PM.","I have a meeting at 3 PM."]],
 qz:[["He is ______ experienced specialist in neurology.",["an","a","the"],"experienced تبدأ بصوت متحرك والاسم مفرد: an."],
     ["Please print ______ final report on my desk.",["the","a","an"],"التقرير محدد (on my desk): the."]]},
{id:16,b:4,lv:"A2",ar:"الأسماء غير المعدودة",en:"Uncountable Nouns",
 f:["Uncountable noun + singular verb (no a/an, no plural -s)","Use some / much / a lot of / a piece of","-"],
 ex:"أسماء تُعامل كمفرد دائماً، لا تُجمع ولا تسبقها a/an. أشهرها في العمل: information, advice, equipment, news, progress, research.",
 key:"عامِل هذه الكلمات مثل water: بدون a/an وبدون ‎-s، والفعل معها مفرد.",
 fx:[["The manager gave me an advice.",["The manager gave me advice.","The manager gave me some advice.","The manager gave me a piece of advice."]],
     ["We bought new equipments.","We bought new equipment."],
     ["I need more informations about the patient.","I need more information about the patient."],
     ["The news are good today.","The news is good today."],
     ["She did a lot of researches on this topic.","She did a lot of research on this topic."],
     ["We made a good progress this week.","We made good progress this week."]],
 qz:[["The IT technician gave us very useful ______ about data safety.",["information","an information","informations"],"information غير معدود: بدون an وبدون جمع."],
     ["Our department has made significant ______ this quarter.",["progress","a progress","progresses"],"progress غير معدود."]]},
{id:17,b:4,lv:"A2/B1",ar:"محددات الكمية",en:"Quantifiers",
 f:["many / a few + countable plural  |  much / a little + uncountable","some in affirmative  |  any in negatives and questions","too + adjective + to + Verb  |  adjective + enough + to + Verb"],
 ex:"many للمعدود الجمع و much لغير المعدود. a few لعدد قليل و a little لكمية قليلة. enough تأتي بعد الصفة وقبل الاسم.",
 key:"معدود (doctors, files) = many / few · غير معدود (time, money) = much / little.",
 fx:[["We don't have many time left.","We don't have much time left."],
     ["The room is enough big.","The room is big enough."],
     ["How much patients are waiting?","How many patients are waiting?"],
     ["There is a few water in the bottle.","There is a little water in the bottle."],
     ["We don't have some gloves left.","We don't have any gloves left."],
     ["I have too much emails to answer.","I have too many emails to answer."],
     ["The box is too heavy for carry.","The box is too heavy to carry."],
     ["He isn't enough old to drive.","He isn't old enough to drive."]],
 qz:[["There are only ______ spots left for the medical training workshop.",["a few","a little","much"],"spots جمع معدود: a few."],
     ["Do we have ______ gloves in the storage cabinet?",["any","a little","much"],"gloves جمع معدود، وفي السؤال نستخدم any."]]},
{id:18,b:4,lv:"B1",ar:"تركيب One of",en:"One of + plural noun",
 f:["One of the + PLURAL noun + SINGULAR verb","One of my friends is...  |  One of the rules requires...","Is one of...?"],
 ex:"الاسم بعد one of يكون جمعاً (واحد من مجموعة)، لكن الفعل يعود على one فيكون مفرداً.",
 key:"اسم جمع + فعل مفرد: One of the doctors IS here.",
 fx:[["One of my colleague is absent.","One of my colleagues is absent."],
     ["One of the main rules require an ID.","One of the main rules requires an ID."],
     ["One of the printers are broken.","One of the printers is broken."],
     ["One of the nurse called me.","One of the nurses called me."],
     ["One of our servers need an update.","One of our servers needs an update."],
     ["One of the best doctor in the city works here.","One of the best doctors in the city works here."]],
 qz:[["One of the senior surgeons ______ leading the operation today.",["is","are","were"],"الفعل يعود على One المفردة: is."],
     ["One of our hospital ______ moved to a new branch last week.",["units","unit","an unit"],"بعد One of يأتي اسم جمع: units."]]},

{id:19,b:5,lv:"A2",ar:"المقارنة والتفضيل",en:"Comparatives & Superlatives",
 f:["short adj + -er than  |  more + long adj + than","the + short adj + -est  |  the most + long adj","not as + adj + as"],
 ex:"للمقارنة بين اثنين: ‎-er للصفة القصيرة (faster than) و more للطويلة (more expensive than). للتفضيل على الكل: the ‎-est أو the most.",
 key:"لا تجمع more مع ‎-er. الصحيح faster وليس more faster. وبعد المقارنة than وليس then.",
 fx:[["This app is more faster than the old one.","This app is faster than the old one."],
     ["He is the most good doctor.","He is the best doctor."],
     ["This room is more big than my office.","This room is bigger than my office."],
     ["The new system is better then the old one.","The new system is better than the old one."],
     ["Today is the most busy day of the week.","Today is the busiest day of the week."],
     ["This report is not as long than the last one.","This report is not as long as the last one."]],
 qz:[["The new diagnostic system is much ______ than the previous version.",["more reliable","reliabler","most reliable"],"reliable صفة طويلة: more reliable than."],
     ["Dr. Laila is one of the ______ cardiologists in the region.",["best","goodest","better"],"تفضيل good الشاذ: the best."]]},
{id:20,b:5,lv:"A2/B1",ar:"الصفات والأظرف وصفات ‎-ed/-ing",en:"Adjectives vs Adverbs, -ed / -ing",
 f:["adjective describes a noun  |  adverb (-ly) describes a verb","-ed = how a person feels  |  -ing = the thing that causes it","-"],
 ex:"الصفة تصف الاسم (fast car) والظرف يصف الفعل (drove quickly). صفات ‎-ed للشخص الذي يشعر (bored) وصفات ‎-ing للشيء المسبب (boring job).",
 key:"الشعور = ‎-ed · المسبب = ‎-ing. وانتبه للشواذ: good → well و hard → hard.",
 fx:[["He speaks English clear.","He speaks English clearly."],
     ["The long lecture made me confusing.","The long lecture made me confused."],
     ["She works very hardly.","She works very hard."],
     ["I am very interesting in this course.","I am very interested in this course."],
     ["The meeting was very bored.","The meeting was very boring."],
     ["He did the job very good.","He did the job very well."]],
 qz:[["The technician checked the database ______ before resetting.",["carefully","careful","carefulness"],"الكلمة تصف الفعل checked فتكون ظرفاً: carefully."],
     ["Working a 12-hour night shift is extremely ______.",["tiring","tired","tire"],"العمل هو المسبب للتعب: tiring."]]},
{id:21,b:5,lv:"B1",ar:"جمل الوصل",en:"Relative Clauses",
 f:["who (people)  |  which / that (things)  |  where (places)  |  whose (possession)","-","-"],
 ex:"تربط جملتين وتعطي معلومة إضافية عن الاسم بدون تكراره.",
 key:"عاقل = who · غير عاقل = which/that · مكان = where · ملكية = whose. ولا تكرر الضمير بعدها (who I met وليس who I met him). وبين فاصلتين (معلومة إضافية) لا تستخدم that.",
 fx:[["The doctor which treated me was helpful.",["The doctor who treated me was helpful.","The doctor that treated me was helpful."]],
     ["This is the clinic when I was trained.","This is the clinic where I was trained."],
     ["The nurse who I met her was very kind.",["The nurse who I met was very kind.","The nurse that I met was very kind.","The nurse whom I met was very kind.","The nurse I met was very kind."]],
     ["The report who you sent is missing a page.",["The report that you sent is missing a page.","The report which you sent is missing a page.","The report you sent is missing a page."]],
     ["This is the doctor who his clinic is on the second floor.","This is the doctor whose clinic is on the second floor."],
     ["The app that we use it every day is slow.",["The app that we use every day is slow.","The app which we use every day is slow.","The app we use every day is slow."]],
     ["My manager, that works in Riyadh, is visiting today.","My manager, who works in Riyadh, is visiting today."]],
 qz:[["The patient ______ file was misplaced has arrived at reception.",["whose","who","which"],"علاقة ملكية بين المريض وملفه: whose."],
     ["The software ______ we installed last week is working perfectly.",["that","who","where"],"software غير عاقل: that أو which."]]},
{id:22,b:5,lv:"A2",strict:true,ar:"حدود الجمل وعلامات الترقيم",en:"Sentence Boundaries",
 f:["Complete sentence = Subject + Verb. Then a new sentence.","Avoid comma splices: sentence, sentence","-"],
 ex:"لا تربط جملتين مستقلتين بفاصلة فقط. أنهِ الجملة بنقطة، اترك مسافة، وابدأ التالية بحرف كبير.",
 key:"نقطة ثم مسافة ثم حرف كبير. التصحيح هنا يُحسب بالحرف: انتبه للنقطة والمسافة والحرف الكبير.",
 fx:[["I opened my laptop, then I read my emails.",["I opened my laptop. Then, I read my emails.","I opened my laptop. Then I read my emails."]],
     ["I opened the app.Then I checked the schedule.",["I opened the app. Then I checked the schedule.","I opened the app. Then, I checked the schedule."]],
     ["the meeting starts at 9 AM.","The meeting starts at 9 AM."],
     ["I finished the report, I sent it to the manager.",["I finished the report. I sent it to the manager.","I finished the report, and I sent it to the manager.","I finished the report and sent it to the manager.","I finished the report; I sent it to the manager."]],
     ["The system was down.we called IT.","The system was down. We called IT."],
     ["She arrived late, however, she finished on time.",["She arrived late. However, she finished on time.","She arrived late; however, she finished on time."]]],
 qz:[["Which sentence has CORRECT punctuation and spacing?",["I finished the morning shift. After that, I went home.","I finished the morning shift, after that, I went home.","I finished the morning shift.after that, I went home."],"الجملة تنتهي بنقطة، ثم مسافة، ثم حرف كبير."],
     ["The doctor arrived early ______ he prepared all surgery tools.",[". Then,",", then","then"],"فكرتان مستقلتان: نبدأ جملة جديدة بـ . Then,"]]},

{id:23,b:6,lv:"B1",ar:"الأفعال المتبوعة بـ ‎-ing أو to",en:"Gerunds vs Infinitives",
 f:["+ -ing: enjoy, mind, be busy, spend time, look forward to","+ to + base: decide, hope, need, want, agree","-"],
 ex:"بعض الأفعال والتراكيب يأتي بعدها فعل بـ ‎-ing، وأخرى يأتي بعدها to + الفعل بأصله.",
 key:"look forward to يليه ‎-ing دائماً: look forward to meeting you.",
 fx:[["I was busy to prepare the report.","I was busy preparing the report."],
     ["We decided changing the schedule.","We decided to change the schedule."],
     ["I look forward to hear from you.","I look forward to hearing from you."],
     ["She enjoys to work with patients.","She enjoys working with patients."],
     ["We need update the software.","We need to update the software."],
     ["Do you mind to wait a few minutes?","Do you mind waiting a few minutes?"]],
 qz:[["Thank you for the update; I look forward to ______ you next Tuesday.",["meeting","meet","to meet"],"look forward to يليه ‎-ing: meeting."],
     ["The management team agreed ______ the new policy starting next month.",["to implement","implementing","implement"],"agree يتبعه to + base."]]},
{id:24,b:6,lv:"A2/B1",ar:"الشرطية الصفرية والأولى",en:"Conditionals 0 & 1",
 f:["Zero: If + Present Simple, Present Simple (facts)","First: If + Present Simple, will + base (real possibility)","What will happen if...?"],
 ex:"الصفرية للحقائق والنتائج المضمونة. الأولى لموقف واقعي محتمل في المستقبل.",
 key:"فعل جملة if دائماً مضارع بسيط. لا تضع will في شق if.",
 fx:[["If you will call him, he will answer.","If you call him, he will answer."],
     ["If you heat ice, it melt.","If you heat ice, it melts."],
     ["If it will rain tomorrow, we will cancel the event.","If it rains tomorrow, we will cancel the event."],
     ["If she come late, the manager will be angry.","If she comes late, the manager will be angry."],
     ["I call you if I will finish early.","I will call you if I finish early."],
     ["If you press this button, the screen will turns off.",["If you press this button, the screen turns off.","If you press this button, the screen will turn off."]]],
 qz:[["If the patient ______ any adverse reactions, notify the doctor immediately.",["develops","will develop","developed"],"في شق if نضع مضارعاً بسيطاً: develops."],
     ["We ______ the project on time if all team members cooperate.",["will complete","complete","completed"],"جواب الشرط لموقف مستقبلي محتمل: will complete."]]},
{id:25,b:6,lv:"B1",ar:"الشرطية الثانية",en:"Second Conditional",
 f:["If + Past Simple, would + Verb (base)","If I didn't have..., I would...","What would you do if...?"],
 ex:"لموقف تخيلي غير واقعي أو مستبعد في الحاضر.",
 key:"شق if ماضي بسيط، والجواب would + base. ويُفضّل were مع كل الضمائر: If I were you.",
 fx:[["If I have more time, I would help you.","If I had more time, I would help you."],
     ["If I was the manager, I will change this.",["If I were the manager, I would change this.","If I was the manager, I would change this."]],
     ["If I would have a car, I would drive to work.","If I had a car, I would drive to work."],
     ["If she knew the answer, she will tell us.","If she knew the answer, she would tell us."],
     ["What would you do if you win a million riyals?","What would you do if you won a million riyals?"],
     ["If I were you, I will talk to the manager.","If I were you, I would talk to the manager."]],
 qz:[["If we ______ a bigger budget, we would upgrade all hospital devices.",["had","have","will have"],"الافتراض التخيلي يتطلب ماضياً بسيطاً في شق if: had."],
     ["What ______ you do if you lost all system access codes?",["would","will","did"],"جواب الشرطية الثانية: would + base."]]},
{id:26,b:6,lv:"B1",ar:"المبني للمجهول",en:"Passive Voice",
 f:["Present: Subject + am/is/are + V3  |  Past: Subject + was/were + V3","is not + V3  |  were not + V3","Was the file updated?","With modals:  can / must / will + be + V3   It must be signed."],
 ex:"يُستخدم حين يكون التركيز على الفعل والحدث وليس على من قام به.",
 key:"المبني للمجهول = فعل be حسب الزمن + التصريف الثالث V3 دائماً.",
 fx:[["The report prepared yesterday.","The report was prepared yesterday."],
     ["Daily emails are send by the system.","Daily emails are sent by the system."],
     ["The patient was examine by Dr. Ali.","The patient was examined by Dr. Ali."],
     ["The files is stored on the server.","The files are stored on the server."],
     ["The new clinic opened by the minister last year.","The new clinic was opened by the minister last year."],
     ["English is speak in many countries.","English is spoken in many countries."],
     ["The form must signed by the doctor.","The form must be signed by the doctor."]],
 qz:[["All patient records ______ securely in the digital database.",["are stored","are store","stored"],"السجلات يتم تخزينها (مجهول مضارع): are stored."],
     ["The urgent message ______ to all doctors last night.",["was delivered","delivered","was deliver"],"مجهول في الماضي: was + V3."]]},
{id:27,b:6,lv:"B1",ar:"الكلام المنقول",en:"Reported Speech",
 f:["Present Simple → Past Simple  |  Present Continuous → Past Continuous  |  will → would  |  can → could","say + (that)  |  tell + person + (that)","-"],
 ex:"عند نقل كلام شخص ترجع الأزمنة خطوة للماضي، وتتغير الضمائر وتعبيرات الزمن.",
 key:"Present → Past · will → would · can → could. و tell لازم بعدها شخص (told me) أما say فلا (said that). وإذا الكلام ما زال صحيحاً يجوز ترك الزمن كما هو، لكن الرجوع للماضي هو الآمن في الاختبارات.",
 fx:[["He said that he is busy, so I did not call him that day.","He said that he was busy, so I did not call him that day."],
     ["She told me she will call later, but she never did.","She told me she would call later, but she never did."],
     ["She said me that the server was down.",["She told me that the server was down.","She said that the server was down.","She said to me that the server was down."]],
     ["He said he can fix the printer, but he could not.","He said he could fix the printer, but he could not."],
     ["They told that they were ready.",["They said that they were ready.","They told me that they were ready.","They told us that they were ready."]],
     ["The nurse said that the patient is sleeping, so we came back an hour later.","The nurse said that the patient was sleeping, so we came back an hour later."]],
 qz:[["Last year the director said that the new branch ______ open in six months.",["would","will","is"],"الكلام قيل في الماضي عن شيء بعده: will تصير would."],
     ["When I called Sara last week, she told me she ______ working on the monthly summary.",["was","is","has"],"is working تصير في المنقول was working."]]},

{id:28,b:7,lv:"A2/B1",ar:"أدوات الربط",en:"Linking Words",
 f:["Contrast: However, / Although + clause / Despite + noun or -ing / A ..., whereas B ...","Cause: because + clause / because of + noun","Result: so / Therefore, + clause"],
 ex:"because للسبب، so و therefore للنتيجة، و although و however و despite للتناقض.",
 key:"although بعدها جملة كاملة، و despite بعدها اسم أو ‎-ing. ولا تجمع although مع but ولا because مع so في نفس الجملة.",
 fx:[["Despite he was tired, he worked.",["Although he was tired, he worked.","Despite being tired, he worked."]],
     ["Because the server crashed, so we stopped work.",["Because the server crashed, we stopped work.","The server crashed, so we stopped work."]],
     ["Although it was late, but she continued working.",["Although it was late, she continued working.","It was late, but she continued working."]],
     ["Despite of the delay, we finished on time.",["Despite the delay, we finished on time.","In spite of the delay, we finished on time."]],
     ["I was late because of the traffic was heavy.",["I was late because the traffic was heavy.","I was late because of the heavy traffic."]],
     ["In spite the rain, the clinic opened on time.",["In spite of the rain, the clinic opened on time.","Despite the rain, the clinic opened on time."]]],
 qz:[["______ the heavy rain and traffic delays, all doctors arrived on time.",["Despite","Although","Because"],"بعدها اسم بدون فعل (the heavy rain): Despite."],
     ["The main server crashed during the night; ______, morning appointments were delayed.",["therefore","although","because"],"للتعبير عن النتيجة: therefore."]]},
{id:29,b:8,lv:"A2",ar:"الوجود: يوجد",en:"There is / There are",
 f:["There is + singular or uncountable  |  There are + plural","There isn't / There aren't + any","Is there...?  |  Are there...?"],
 ex:"لقول إن شيئاً موجود في مكان. is مع المفرد وغير المعدود، و are مع الجمع.",
 key:"الفعل يتبع الاسم اللي بعده: There is a printer / There are two printers. ولا تستخدم It has أو There have للوجود.",
 fx:[["There is two printers in the office.","There are two printers in the office."],
     ["There are a problem with the server.","There is a problem with the server."],
     ["Is there any chairs in the waiting room?","Are there any chairs in the waiting room?"],
     ["It has a pharmacy near the hospital.","There is a pharmacy near the hospital."],
     ["There have many patients today.","There are many patients today."],
     ["There aren't some beds available.","There aren't any beds available."]],
 qz:[["______ a meeting room on the second floor?",["Is there","Are there","Has there"],"a meeting room مفرد: Is there."],
     ["______ three nurses on duty tonight.",["There are","There is","They are"],"three nurses جمع: There are."]]},
{id:30,b:8,lv:"A2",ar:"الضمائر والملكية",en:"Pronouns & Possessives",
 f:["Subject: I he she we they  |  Object: me him her us them","my his her our their + noun  |  mine his hers ours theirs (alone)","Reflexive: myself, yourself, himself, herself, ourselves, themselves"],
 ex:"ضمير الفاعل قبل الفعل، وضمير المفعول بعد الفعل أو حرف الجر. صفة الملكية قبل الاسم (my file) وضمير الملكية لوحده (it is mine).",
 key:"بعد الفعل وحرف الجر: me / him / her / us / them. قبل الاسم: my / his / her / our / their. و it's = it is أما its فللملكية.",
 fx:[["Please send the report to I.","Please send the report to me."],
     ["This is she office.","This is her office."],
     ["The doctor asked they to wait.","The doctor asked them to wait."],
     ["This laptop is my.","This laptop is mine."],
     ["He fixed the printer hisself.","He fixed the printer himself."],
     ["The hospital changed it's logo.","The hospital changed its logo."]],
 qz:[["Dr. Sara is busy. Can you call ______ later?",["her","she","hers"],"بعد الفعل call يأتي ضمير المفعول: her."],
     ["Is this badge yours? - No, ______ is in my pocket.",["mine","my","me"],"لا يوجد اسم بعدها، فنستخدم ضمير الملكية: mine."]]},
{id:31,b:8,lv:"A2",ar:"صيغة الأمر",en:"Imperatives",
 f:["Verb (base) + ...   Wait here.","Don't + Verb (base)   Don't touch it.","Let's + Verb (base)   Let's start."],
 ex:"للأوامر والتعليمات والإرشادات. نبدأ بالفعل بأصله مباشرة بدون فاعل.",
 key:"الأمر يبدأ بالفعل بأصله بدون to. والنهي Don't + الفعل (وليس No أو Not). وللاقتراح Let's + الفعل.",
 fx:[["Not touch the screen.","Don't touch the screen."],
     ["Please to sit down.","Please sit down."],
     ["Don't to forget your badge.","Don't forget your badge."],
     ["Let's to start the meeting.","Let's start the meeting."],
     ["Closes the door, please.","Close the door, please."],
     ["No open this file.","Don't open this file."]],
 qz:[["______ your hands before entering the room.",["Wash","Washing","To wash"],"الأمر يبدأ بالفعل بأصله: Wash."],
     ["______ use your phone in the lab.",["Don't","Not","No"],"النهي: Don't + الفعل."]]},
{id:32,b:8,lv:"A2",ar:"ظروف التكرار وترتيب الجملة",en:"Frequency Adverbs & Word Order",
 f:["Subject + adverb + main verb   She always arrives early.","Subject + be + adverb   He is never late.","Subject + Verb + Object + Place + Time"],
 ex:"always, usually, often, sometimes, never تأتي قبل الفعل الأساسي وبعد فعل be. وترتيب الجملة ثابت: فاعل، فعل، مفعول، ثم المكان، ثم الزمان.",
 key:"قبل الفعل الأساسي وبعد be: I always check / I am always ready. والمفعول يلصق بالفعل: I like my job very much.",
 fx:[["She arrives always early.","She always arrives early."],
     ["He never is late.","He is never late."],
     ["I like very much my job.","I like my job very much."],
     ["We have every Monday a meeting.",["We have a meeting every Monday.","Every Monday, we have a meeting."]],
     ["Always I check my email in the morning.","I always check my email in the morning."],
     ["I go usually to work by car.","I usually go to work by car."]],
 qz:[["The manager ______ the reports on Sunday.",["usually reviews","reviews usually","is usually review"],"الظرف قبل الفعل الأساسي: usually reviews."],
     ["Which sentence has the correct word order?",["I sent the file to the manager yesterday.","I sent yesterday the file to the manager.","I yesterday sent to the manager the file."],"فاعل، فعل، مفعول، ثم الزمان في الآخر."]]},
{id:33,b:8,lv:"A2",ar:"حروف الجر للزمان والمكان",en:"Prepositions: in / on / at",
 f:["at + clock time / exact point   at 9 AM, at the reception, at night","on + day / date / surface   on Monday, on 5 May, on the desk","in + month / year / part of day / inside   in June, in 2024, in the morning, in the room"],
 ex:"at للوقت المحدد والنقطة، on لليوم والتاريخ والسطح، in للشهر والسنة والمكان المغلق.",
 key:"at للساعة · on لليوم · in للشهر والسنة. ولا حرف جر قبل last / next / this / every: next week وليس in next week.",
 fx:[["The meeting is in Monday.","The meeting is on Monday."],
     ["I start work on 8 AM.","I start work at 8 AM."],
     ["She joined the hospital on 2019.","She joined the hospital in 2019."],
     ["I will call you in next week.","I will call you next week."],
     ["He arrived to the office late.","He arrived at the office late."],
     ["I usually work in night.","I usually work at night."]],
 qz:[["The clinic opens ______ 7 AM ______ weekdays.",["at / on","in / on","at / in"],"at للساعة و on للأيام."],
     ["My appointment is ______ the morning.",["in","on","at"],"أجزاء اليوم: in the morning."]]},
{id:34,b:9,lv:"A2",ar:"تكوين السؤال",en:"Question Formation",
 f:["Wh-word + auxiliary + Subject + Verb?   Where do you work?","With be: Wh-word + be + Subject?   Where is the file?","Subject question, no auxiliary:   Who called you?"],
 ex:"في السؤال يتقدم الفعل المساعد (do / does / did / is / are / can) على الفاعل. وإذا كان السؤال عن الفاعل نفسه فلا نستخدم do / does / did.",
 key:"كلمة السؤال + مساعد + فاعل + فعل: Where does she work? وسؤال الفاعل بدون مساعد: Who sent this?",
 fx:[["Where you work?","Where do you work?"],
     ["What time the clinic opens?","What time does the clinic open?"],
     ["Why she is late?","Why is she late?"],
     ["Who did send this email?","Who sent this email?"],
     ["How many patients you saw yesterday?","How many patients did you see yesterday?"],
     ["What means this word?","What does this word mean?"]],
 qz:[["Where ______ the manager yesterday?",["was","did","were"],"مع be في الماضي والفاعل مفرد: was."],
     ["Who ______ the server last night?",["restarted","did restart","did restarted"],"السؤال عن الفاعل، فلا نستخدم did."]]},
{id:35,b:9,lv:"B1",ar:"الأسئلة الذيلية",en:"Question Tags",
 f:["Positive sentence + negative tag   It is ready, isn't it?","Negative sentence + positive tag   You don't work here, do you?","Tag = same auxiliary + pronoun"],
 ex:"سؤال قصير في آخر الجملة للتأكد. نستخدم نفس الفعل المساعد ونعكس الإثبات والنفي.",
 key:"جملة مثبتة ← ذيل منفي، وجملة منفية ← ذيل مثبت، بنفس المساعد. وإذا ما فيه مساعد نستخدم do / does / did.",
 fx:[["You are the new nurse, isn't it?","You are the new nurse, aren't you?"],
     ["She works here, isn't she?","She works here, doesn't she?"],
     ["He can fix it, can he?","He can fix it, can't he?"],
     ["They didn't call, didn't they?","They didn't call, did they?"],
     ["You sent the report, don't you?","You sent the report, didn't you?"],
     ["The meeting is at 10, is it?","The meeting is at 10, isn't it?"]],
 qz:[["You have finished the report, ______?",["haven't you","don't you","have you"],"الجملة مثبتة ومساعدها have: haven't you."],
     ["She doesn't work on Fridays, ______?",["does she","doesn't she","is she"],"الجملة منفية بـ doesn't: الذيل مثبت does she."]]},
{id:36,b:9,lv:"B1",ar:"الأسئلة غير المباشرة",en:"Indirect Questions",
 f:["Could you tell me / Do you know + wh-word + Subject + Verb","Yes/No: Do you know if / whether + Subject + Verb","No do / does / did and no inversion after the wh-word"],
 ex:"سؤال مؤدب يبدأ بعبارة مثل Could you tell me. بعدها يرجع ترتيب الجملة عادياً: فاعل ثم فعل.",
 key:"بعد Could you tell me / Do you know الترتيب عادي: where the lab is وليس where is the lab. وبدون do / does / did.",
 fx:[["Could you tell me where is the pharmacy?","Could you tell me where the pharmacy is?"],
     ["Do you know what time does the clinic open?","Do you know what time the clinic opens?"],
     ["Can you tell me where did he go?","Can you tell me where he went?"],
     ["Do you know is the doctor available?",["Do you know if the doctor is available?","Do you know whether the doctor is available?"]],
     ["I don't know where is my badge.","I don't know where my badge is."],
     ["Could you tell me how much does it cost?","Could you tell me how much it costs?"]],
 qz:[["Could you tell me where ______?",["the meeting room is","is the meeting room","does the meeting room"],"ترتيب عادي بعد Could you tell me: فاعل ثم فعل."],
     ["Do you know ______ the report is ready?",["if","does","what"],"سؤال نعم/لا غير مباشر يبدأ بـ if."]]},
{id:37,b:1,lv:"A2/B1",ar:"أفعال الحالة",en:"Stative Verbs",
 f:["know, understand, believe, want, need, like, love, hate, have (own), belong, seem","Not used in continuous:   I know (not I am knowing)","Do you understand?   (not Are you understanding?)"],
 ex:"أفعال تصف حالة أو شعوراً وليس حركة، فلا تأتي في الزمن المستمر حتى لو الكلام عن الآن.",
 key:"know / want / need / like / understand / have (ملكية) لا تأخذ ‎-ing: I need help now وليس I am needing.",
 fx:[["I am knowing the answer.","I know the answer."],
     ["She is wanting a new laptop.","She wants a new laptop."],
     ["We are needing more staff today.","We need more staff today."],
     ["Are you understanding the instructions?","Do you understand the instructions?"],
     ["He is having two phones.","He has two phones."],
     ["This badge is belonging to Dr. Ali.","This badge belongs to Dr. Ali."]],
 qz:[["I ______ what you mean now.",["understand","am understanding","understanding"],"understand فعل حالة، لا يأتي مستمراً."],
     ["This software ______ to the IT department.",["belongs","is belonging","belonging"],"belong فعل حالة: belongs."]]},
{id:38,b:2,lv:"B1",ar:"just / already / yet / still",en:"just / already / yet / still",
 f:["have/has + just / already + V3   I have just finished.","haven't/hasn't + V3 + yet   She hasn't replied yet.","Have you + V3 + yet?  |  I still haven't received it."],
 ex:"just لشيء حدث قبل لحظات، already لشيء تم قبل المتوقع، yet في النفي والسؤال وتأتي آخر الجملة، still لشيء لم يتغير.",
 key:"just و already بين have والتصريف الثالث. yet في آخر الجملة مع النفي والسؤال. still قبل haven't. (الأمريكيون يستخدمون معها الماضي البسيط كثيراً: I already ate.)",
 fx:[["I have finished just the report.","I have just finished the report."],
     ["She hasn't replied already.","She hasn't replied yet."],
     ["I have sent already the file.",["I have already sent the file.","I have sent the file already."]],
     ["I haven't still received the invoice.","I still haven't received the invoice."],
     ["I have not finished yet the report.","I have not finished the report yet."],
     ["She has already went home.","She has already gone home."]],
 qz:[["The technician has ______ left. You missed him by one minute.",["just","yet","still"],"حدث قبل لحظات: just."],
     ["We haven't received the lab results ______.",["yet","already","just"],"في النفي وآخر الجملة: yet."]]},
{id:39,b:4,lv:"B1",ar:"both / either / neither",en:"both / either / neither",
 f:["both A and B + plural verb","either A or B  |  neither A nor B","both of / either of / neither of + the / these / my + plural noun"],
 ex:"both للاثنين معاً، either لواحد من اثنين، neither لنفي الاثنين. neither معناها منفي فلا نضيف not.",
 key:"both … and · either … or · neither … nor. ومع neither الفعل مثبت: Neither of them is ready.",
 fx:[["Both the doctor or the nurse were there.","Both the doctor and the nurse were there."],
     ["Neither of them doesn't know the password.",["Neither of them knows the password.","Neither of them know the password."]],
     ["You can either call and send an email.","You can either call or send an email."],
     ["Neither the printer or the scanner works.","Neither the printer nor the scanner works."],
     ["Both of my colleague are on leave.","Both of my colleagues are on leave."],
     ["I don't like neither option.",["I don't like either option.","I like neither option."]]],
 qz:[["______ of the two servers is working. We need a technician.",["Neither","Both","Either"],"ولا واحد يشتغل: Neither."],
     ["______ Dr. Ali and Dr. Sara attended the conference.",["Both","Either","Neither"],"الاثنان معاً مع and: Both."]]},
{id:40,b:5,lv:"B1",ar:"so و such",en:"so / such",
 f:["so + adjective / adverb   so busy, so quickly","such + (a/an) + adjective + noun   such a busy day","so / such ... that + result"],
 ex:"للتأكيد والمبالغة. so قبل الصفة أو الظرف وحدها، و such قبل صفة معها اسم.",
 key:"so + صفة · such + (a/an) صفة + اسم. إذا فيه اسم بعد الصفة فهي such.",
 fx:[["It was a so long meeting.","It was such a long meeting."],
     ["The system is such slow today.","The system is so slow today."],
     ["She is so a good doctor.","She is such a good doctor."],
     ["It was so busy day that I forgot lunch.","It was such a busy day that I forgot lunch."],
     ["He speaks such quickly.","He speaks so quickly."],
     ["They are so nice people.","They are such nice people."]],
 qz:[["The training was ______ useful that we asked for another session.",["so","such","such a"],"بعدها صفة فقط بدون اسم: so."],
     ["It was ______ difficult case that three doctors were called.",["such a","so","such"],"صفة مع اسم مفرد: such a."]]},
{id:41,b:6,lv:"B1",ar:"فعل + شخص + to",en:"Verb + object + to",
 f:["want / ask / tell / need / expect + person + to + Verb","Negative: tell + person + not to + Verb","Not: want that + person + verb"],
 ex:"حين تريد من شخص آخر أن يفعل شيئاً: الفعل، ثم الشخص، ثم to، ثم الفعل بأصله.",
 key:"I want you to come وليس I want that you come. وبعد الفعل ضمير مفعول (him / her / them) ثم to.",
 fx:[["I want that you send the report today.","I want you to send the report today."],
     ["The manager asked me send the file.","The manager asked me to send the file."],
     ["She told to me to wait outside.","She told me to wait outside."],
     ["The doctor wants she to rest.","The doctor wants her to rest."],
     ["He told us don't touch the device.","He told us not to touch the device."],
     ["We need that the technician checks the server.","We need the technician to check the server."]],
 qz:[["The supervisor wants ______ the form before noon.",["us to sign","that we sign","us sign"],"want + شخص + to + فعل."],
     ["I asked the nurse ______ the patient's file.",["to bring","bring","bringing"],"ask + شخص + to + فعل."]]},
{id:42,b:6,lv:"B1",ar:"الأفعال المركبة",en:"Phrasal Verbs",
 f:["Verb + particle = new meaning:   turn on, fill in, look for, set up, log in, find out, give up","With a noun:   turn on the screen  /  turn the screen on","With a pronoun the particle goes last:   turn it on"],
 ex:"فعل مع حرف يعطيان معنى جديداً. ومع الضمير (it / them / me) يأتي الضمير في الوسط.",
 key:"الضمير في الوسط: turn it on وليس turn on it. و look for = يبحث عن، look at = ينظر إلى، fill in = يعبّي.",
 fx:[["The screen is off. Please turn on it.","The screen is off. Please turn it on."],
     ["I am looking my keys.","I am looking for my keys."],
     ["Here is the form. Please fill in it.",["Here is the form. Please fill it in.","Here is the form. Please fill it out."]],
     ["Can you pick up me at 5?","Can you pick me up at 5?"],
     ["I need to log to the system.",["I need to log in to the system.","I need to log into the system.","I need to log on to the system."]],
     ["She gave up to smoke.","She gave up smoking."]],
 qz:[["The alarm is too loud. Can you ______?",["turn it off","turn off it","turn it of"],"الضمير في الوسط: turn it off."],
     ["I'm ______ the patient's file. Have you seen it?",["looking for","looking at","looking after"],"البحث عن شيء: look for."]]},
{id:43,b:7,lv:"B1",ar:"جمل الزمن المستقبلية و unless",en:"Future Time Clauses & unless",
 f:["when / as soon as / before / after / until + Present Simple, will + Verb","unless = if ... not   Unless you hurry, you will be late.","No will after when / as soon as / until / unless"],
 ex:"بعد أدوات الزمن (when, as soon as, before, after, until) نستخدم المضارع البسيط حتى لو المعنى مستقبل. و unless تعني «إلا إذا» وفعلها مثبت.",
 key:"لا will بعد when / as soon as / until / unless. و unless معناها منفي أصلاً فلا تضف not.",
 fx:[["I will call you when I will arrive.","I will call you when I arrive."],
     ["As soon as the results will be ready, we will inform you.","As soon as the results are ready, we will inform you."],
     ["Unless you don't hurry, you will miss the meeting.","Unless you hurry, you will miss the meeting."],
     ["We will wait until the doctor will come.","We will wait until the doctor comes."],
     ["Before you will leave, please sign the form.","Before you leave, please sign the form."],
     ["I won't start unless you will tell me.","I won't start unless you tell me."]],
 qz:[["I will send the report as soon as I ______ it.",["finish","will finish","finished"],"بعد as soon as مضارع بسيط: finish."],
     ["You can't enter the lab ______ you wear a badge.",["unless","if","when"],"إلا إذا لبست البطاقة: unless."]]},
{id:44,b:8,lv:"A2",ar:"ملكية ‎'s وأسماء الإشارة",en:"Possessive 's, this / these",
 f:["singular noun + 's   the doctor's office  |  plural noun + s'   the nurses' room","this / that + singular   |   these / those + plural","a friend of mine   (not a friend of me)"],

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* عزل الإنجليزي داخل النص العربي حتى لا تنقلب الأسهم وعلامات الترقيم */
function mix(s){
  s=String(s);
  const re=/[('’\-]?[A-Za-z](?:[A-Za-z0-9'’+\/\-.,?!()→·:=| ]*[A-Za-z0-9)?!])?/g;
  let out='',last=0,m;
  while((m=re.exec(s))){
    let run=m[0];
    let o=(run.match(/\(/g)||[]).length,c=(run.match(/\)/g)||[]).length;
    while(c>o&&/\)[.,: ]*$/.test(run)){run=run.replace(/[.,: ]*\)[.,: ]*$/,'');c--;}   /* قوس إغلاق فُتح في النص العربي يبقى خارج المقطع */
    if(o>c&&run.charAt(0)==='('){out+=esc(s.slice(last,m.index+1));last=m.index+1;run=run.slice(1);m.index++;}
    run=run.replace(/[.,: ]+$/,'');
    out+=esc(s.slice(last,m.index))+'<bdi class="en" dir="ltr">'+esc(run)+'</bdi>';
    last=m.index+run.length;re.lastIndex=last;
  }
  return out+esc(s.slice(last));
}

function itemsOf(tp){
  const a=[{id:'t'+tp.id+'k',t:tp,kind:'k',i:0}];
  tp.fx.forEach((_,i)=>a.push({id:'t'+tp.id+'f'+i,t:tp,kind:'f',i:i}));
  tp.qz.forEach((_,i)=>a.push({id:'t'+tp.id+'q'+i,t:tp,kind:'q',i:i}));
  return a;
}
const ALL=TOPICS.reduce((a,tp)=>a.concat(itemsOf(tp)),[]);

/* ---------- الحفظ ---------- */
const KEY='grammar_map_v2';
let S={items:{},sound:true,updatedAt:0,log:{},theme:null};
function loadLocal(){
  try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object'&&o.items)S=Object.assign(S,o);}}catch(e){}
  if(!S.log||typeof S.log!=='object')S.log={};
  const old=today()-120;Object.keys(S.log).forEach(k=>{if(+k<old)delete S.log[k];});
}
function snapshot(){return {items:S.items,sound:S.sound,updatedAt:S.updatedAt,log:S.log,theme:S.theme};}
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  cloudPush();
}
let cloudRef=null,cloudBusy=false,cloudDirty=false,cloudTimer=0;
function cloudPush(){
  if(!cloudRef)return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(async function run(){
    if(cloudBusy){cloudDirty=true;return;}
    cloudBusy=true;
    try{await cloudRef.set(JSON.parse(JSON.stringify(snapshot())));}
    catch(e){if(e&&e.code==='invalid_argument'){cloudRef=null;$('#sync').textContent='التقدّم محفوظ على هذا الجهاز.';}}
    cloudBusy=false;
    if(cloudDirty&&cloudRef){cloudDirty=false;run();}
  },1500);
}
async function cloudInit(){
  try{
    if(!window.claude||typeof window.claude.use!=='function')return;
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const db=res[0],user=res[1];
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const ref=db.doc('data/users/'+id+'/progress');
    const snap=await ref.get();
    cloudRef=ref;
    $('#sync').textContent='التقدّم محفوظ في حسابك ويظهر على كل أجهزتك.';
    const remote=snap&&snap.exists?snap.data():null;
    if(remote&&remote.items&&(remote.updatedAt||0)>(S.updatedAt||0)){
      S=Object.assign(S,JSON.parse(JSON.stringify(remote)));
      if(!S.log)S.log={};
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      applyTheme();renderAll();
    }else if(S.updatedAt&&(!remote||(remote.updatedAt||0)<S.updatedAt)){
      cloudPush();
    }
  }catch(e){}
}

  const t=S.theme||document.documentElement.getAttribute('data-theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);

/* ---------- التقدّم ---------- */
function grade(id,ok){
  const t=today();let r=S.items[id];const fresh=!r;
  if(!r)r=S.items[id]={b:0,d:t,r:0,w:0};
  if(ok){r.r++;if(fresh||r.d<=t){r.b=Math.min(r.b+1,4);r.d=t+IV[r.b];}}
  else{r.w++;r.b=0;r.d=t;}
  const L=S.log[t]||(S.log[t]=[0,0]);L[0]++;if(ok)L[1]++;
  save();
}
function stat(tp){
  const t=today(),its=itemsOf(tp);let sum=0,seen=0,due=0,wrong=0,all=true;
  its.forEach(it=>{const r=S.items[it.id];
    if(r){seen++;sum+=Math.min(r.b,3);if(r.d<=t)due++;wrong+=r.w;if(r.b<3)all=false;}else all=false;});
  return {pct:sum/(3*its.length),seen:seen,due:due,wrong:wrong,n:its.length,
          state:all?'mastered':seen===0?'new':due>0?'due':'learning'};
}
function totals(){
  const t=today();let mastered=0,due=0,active=0,seen=0,sum=0;
  TOPICS.forEach(tp=>{const st=stat(tp);if(st.state==='mastered')mastered++;sum+=st.pct;});
  ALL.forEach(it=>{const r=S.items[it.id];if(r){seen++;if(r.d<=t)due++;if(r.b===0&&r.w>0)active++;}});
  return {mastered:mastered,due:due,active:active,seen:seen,overall:Math.round(sum/TOPICS.length*100)};
}
function streak(){let n=0,d=today();if(!S.log[d])d--;while(S.log[d]&&S.log[d][0]>0){n++;d--;}return n;}
function nextTopic(){return TOPICS.find(tp=>stat(tp).seen===0)||null;}

/* ---------- الصوت والنطق ---------- */
let actx=null;
function beep(kind){
  if(!S.sound)return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!actx)actx=new AC();
    if(actx.state==='suspended')actx.resume();
    const now=actx.currentTime;
    const tone=(f,at,dur,type,vol)=>{const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
      o.type=type;o.frequency.setValueAtTime(f,now+at);g.gain.setValueAtTime(vol,now+at);g.gain.exponentialRampToValueAtTime(0.01,now+at+dur);o.start(now+at);o.stop(now+at+dur);};
    if(kind==='ok'){tone(523,0,.12,'sine',.18);tone(784,.1,.18,'sine',.18);}
    else if(kind==='bad'){tone(200,0,.22,'triangle',.16);}
    else if(kind==='done'){[523,659,784,1047].forEach((f,i)=>tone(f,i*.08,.22,'triangle',.16));}
  }catch(e){}
}
const canSpeak=('speechSynthesis' in window)&&(typeof window.SpeechSynthesisUtterance!=='undefined');
function spk(text){return canSpeak?'<button type="button" class="spk" data-act="speak" data-say="'+esc(text)+'" aria-label="استمع للجملة">'+ICON.spk+'</button>':'';}
function speak(text){
  if(!canSpeak)return;
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.92;
    const v=(window.speechSynthesis.getVoices()||[]).find(x=>/^en[-_]/i.test(x.lang));if(v)u.voice=v;
    window.speechSynthesis.cancel();window.speechSynthesis.speak(u);
  }catch(e){}
}

function ring(pct){

          (filter==='due'&&st.due>0)||(filter==='mastered'&&st.state==='mastered');
